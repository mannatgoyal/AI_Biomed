version: '3.8'

services:
  cdss-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_biomed_cdss
    ports:
      - "8501:8501"
    volumes:
      - ./results:/app/results
      - ./checkpoints:/app/checkpoints
    restart: unless-stopped
    command: ["streamlit", "run", "app.py", "--server.port=8501", "--server.address=0.0.0.0"]

  pipeline-runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_biomed_pipeline
    volumes:
      - ./results:/app/results
      - ./checkpoints:/app/checkpoints
    profiles:
      - tools
    entrypoint: ["python", "main.py", "--mode", "all"]

